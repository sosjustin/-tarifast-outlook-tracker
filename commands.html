<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Tarifast Outlook Tracker Runtime</title>

  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

  <script>
    function onMessageSendHandler(event) {
      event.completed({
        allowEvent: true
      });
    }

    Office.actions.associate(
      "onMessageSendHandler",
      onMessageSendHandler
    );
  </script>
</head>
<body></body>
</html>
